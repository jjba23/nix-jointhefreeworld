# Build every package in the set on every push and every pull request, so that
# a project that breaks its own expression -- or an input that moves under the
# set -- is noticed here rather than by whoever runs `nix profile install' next.
#
# Once per flake: the root's run covers every package of all three, and the two
# halves cover the locks that a `?dir=' consumer would get from them.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: docker
    container:
      image: nixos/nix:latest
    env:
      # Flakes are still behind a flag in Nix 2.35.
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: nix flake check (dependencies)
        run: nix flake check --print-build-logs ./deps

      - name: nix flake check (Emacs)
        run: nix flake check --print-build-logs ./emacs

      - name: nix flake check (the set)
        run: nix flake check --print-build-logs
