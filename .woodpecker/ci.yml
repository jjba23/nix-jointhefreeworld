# Build every package in the set on every push and every pull request, so that
# a project that breaks its own expression -- or an input that moves under the
# set -- is noticed here rather than by whoever runs `nix profile install' next.
#
# Three checks in one step, and therefore in one container: a step is a fresh
# container with an empty store, so splitting them would fetch nixpkgs three
# times.  The set's run covers every package of all three flakes; the two halves
# cover the locks that a `?dir=' consumer of them would get.

clone:
  - name: "⬇️ Clone Git repository"
    image: woodpeckerci/plugin-git
    settings:
      depth: 1

steps:
  flake-checks:
    name: "🧱 nix flake check"
    image: nixos/nix:latest
    when:
      - event: [push, pull_request]
    environment:
      # Flakes are still behind a flag in Nix 2.35.
      NIX_CONFIG: "experimental-features = nix-command flakes"
    commands:
      - nix flake check --print-build-logs ./guile-deps
      - nix flake check --print-build-logs ./emacs
      - nix flake check --print-build-logs
